services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://routewise:routewise@postgres:5432/routewise
    volumes:
      - ./data:/app/data   # semantic cache SQLite persists across restarts
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s   # model loading at startup

  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0",
              "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    ports: ["8501:8501"]
    environment:
      ROUTEWISE_URL: http://app:8000
      ROUTEWISE_API_KEY: rw-dev-key
      DATABASE_URL: postgresql://routewise:routewise@postgres:5432/routewise
    volumes:
      - ./data:/app/data
    depends_on:
      app: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: routewise
      POSTGRES_PASSWORD: routewise
      POSTGRES_DB: routewise
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routewise"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
